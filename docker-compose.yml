version: '3'

services:
  nginx:
    image: nginx:latest
    ports:
      - "8000:8000"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
      - node
      - python

  php:
    build: ./php
    ports:
      - "8001:8001"

  node:
    build: ./node
    ports:
      - "8002:8002"

  python:
    build: ./python
    ports:
      - "8003:8003"
